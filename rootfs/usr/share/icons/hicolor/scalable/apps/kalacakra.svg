<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Latar belakang obsidian 3D dengan kedalaman radial -->
    <radialGradient id="bgBadge" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1f1938"/>
      <stop offset="52%" stop-color="#0e0b1c"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>

    <!-- Emas Keraton 3D (Specular Metal) -->
    <linearGradient id="gold3d" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="22%" stop-color="#ffd86b"/>
      <stop offset="50%" stop-color="#d49b27"/>
      <stop offset="78%" stop-color="#8c5a08"/>
      <stop offset="100%" stop-color="#f6c851"/>
    </linearGradient>

    <!-- Bevel Emas Gelap untuk Sisi Dalam 3D -->
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a4e06"/>
      <stop offset="50%" stop-color="#c99222"/>
      <stop offset="100%" stop-color="#3b2302"/>
    </linearGradient>

    <!-- Baja Titanium / Obsidian 3D -->
    <linearGradient id="steel3d" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="45%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Inti Energi Neon Cyan-Magenta (Kalacakra Core) -->
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#38bdf8"/>
      <stop offset="68%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyberRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Efek Bayangan 3D Berlapis -->
    <filter id="drop3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22d3ee" flood-opacity="0.22"/>
    </filter>

    <filter id="neonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Perisai Dasar (Squircle 3D Badge) -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bgBadge)" stroke="url(#goldShadow)" stroke-width="6" filter="url(#drop3d)"/>
  <rect x="82" y="82" width="860" height="860" rx="194" fill="none" stroke="url(#cyberRing)" stroke-width="2.5" opacity="0.45"/>

  <!-- Halo Cahaya Belakang -->
  <circle cx="512" cy="512" r="340" fill="url(#coreGlow)" opacity="0.22"/>

  <!-- Cakra 3D Utama (8 Penjuru Mata Angin / Roda Waktu) -->
  <g transform="translate(512 512)" filter="url(#drop3d)">

    <!-- 8 Pucuk Surya Majapahit (Luar) -->
    <g fill="url(#gold3d)" stroke="url(#goldShadow)" stroke-width="3">
      <polygon points="0,-418 38,-316 0,-340 -38,-316"/>
      <polygon points="0,418 38,316 0,340 -38,316"/>
      <polygon points="-418,0 -316,38 -340,0 -316,-38"/>
      <polygon points="418,0 316,38 340,0 316,-38"/>
      <polygon points="296,-296 250,-196 240,-240 196,-250"/>
      <polygon points="-296,-296 -250,-196 -240,-240 -196,-250"/>
      <polygon points="296,296 250,196 240,240 196,250"/>
      <polygon points="-296,296 -250,196 -240,240 -196,250"/>
    </g>

    <!-- Cincin Luar Baja & Emas Bevel 3D -->
    <circle r="326" fill="url(#steel3d)" stroke="url(#gold3d)" stroke-width="18"/>
    <circle r="304" fill="none" stroke="#fff6d6" stroke-width="2" opacity="0.6"/>
    <circle r="268" fill="#090714" stroke="url(#goldShadow)" stroke-width="14"/>

    <!-- Cincin Energi Sirkuit Neon -->
    <circle r="286" fill="none" stroke="url(#cyberRing)" stroke-width="4" stroke-dasharray="28 18" filter="url(#neonBloom)"/>

    <!-- 8 Jari-Jari Roda Waktu (3D Beveled Spokes) -->
    <g>
      <!-- Jari-jari Vertikal & Horizontal -->
      <polygon points="0,-266 26,-110 0,-80 -26,-110" fill="url(#gold3d)" stroke="url(#goldShadow)" stroke-width="2"/>
      <polygon points="0,-266 0,-80 -26,-110" fill="url(#goldShadow)" opacity="0.55"/>

      <polygon points="0,266 26,110 0,80 -26,110" fill="url(#gold3d)" stroke="url(#goldShadow)" stroke-width="2"/>
      <polygon points="0,266 0,80 26,110" fill="url(#goldShadow)" opacity="0.55"/>

      <polygon points="-266,0 -110,26 -80,0 -110,-26" fill="url(#gold3d)" stroke="url(#goldShadow)" stroke-width="2"/>
      <polygon points="-266,0 -80,0 -110,26" fill="url(#goldShadow)" opacity="0.55"/>

      <polygon points="266,0 110,26 80,0 110,-26" fill="url(#gold3d)" stroke="url(#goldShadow)" stroke-width="2"/>
      <polygon points="266,0 80,0 110,-26" fill="url(#goldShadow)" opacity="0.55"/>

      <!-- Jari-jari Diagonal -->
      <g transform="rotate(45)">
        <polygon points="0,-266 22,-110 0,-80 -22,-110" fill="url(#gold3d)" stroke="url(#goldShadow)" stroke-width="2"/>
        <polygon points="0,266 22,110 0,80 -22,110" fill="url(#gold3d)" stroke="url(#goldShadow)" stroke-width="2"/>
        <polygon points="-266,0 -110,22 -80,0 -110,-22" fill="url(#gold3d)" stroke="url(#goldShadow)" stroke-width="2"/>
        <polygon points="266,0 110,22 80,0 110,-22" fill="url(#gold3d)" stroke="url(#goldShadow)" stroke-width="2"/>
      </g>
    </g>

    <!-- Mandala Inti Tengah (3D Hub) -->
    <circle r="118" fill="url(#steel3d)" stroke="url(#gold3d)" stroke-width="12"/>
    <polygon points="0,-96 68,-68 96,0 68,68 0,96 -68,68 -96,0 -68,-68" fill="none" stroke="url(#gold3d)" stroke-width="4" opacity="0.85"/>

    <!-- Permata Energi Kalacakra (3D Glowing Orb) -->
    <circle r="64" fill="url(#coreGlow)" filter="url(#neonBloom)"/>
    <circle r="58" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.75"/>
    <!-- Highlight Pantulan Kaca 3D (Specular Gloss) -->
    <ellipse cx="-18" cy="-22" rx="24" ry="14" transform="rotate(-28 -18 -22)" fill="#ffffff" opacity="0.65"/>
  </g>
</svg>
