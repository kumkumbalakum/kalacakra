# ==============================================================================
# Kalacakra OS - Kernel Security Hardening Configuration
# Defense-in-depth settings for unprivileged exploits, memory, and networking
# ==============================================================================

# Sembunyikan alamat pointer kernel untuk mencegah eksploitasi memori
kernel.kptr_restrict = 2

# Batasi pembacaan buffer log dmesg kernel hanya untuk superuser
kernel.dmesg_restrict = 1

# Batasi eksekusi eBPF unprivileged untuk memperkecil attack surface
kernel.unprivileged_bpf_disabled = 1

# Mencegah eksploitasi file temp symlink dan hardlink race condition
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Proteksi terhadap IP spoofing
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Proteksi terhadap SYN flood attack
net.ipv4.tcp_syncookies = 1

# Nonaktifkan ICMP redirect acceptance
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
