# Kalacakra OS - Encrypted DNS-over-TLS (DoT) Default Configuration
# Privacy-preserving resolvers (Quad9 default, Cloudflare fallback)

[Resolve]
DNS=9.9.9.9#dns.quad9.net 1.1.1.1#cloudflare-dns.com
FallbackDNS=149.112.112.112#dns.quad9.net 1.0.0.1#cloudflare-dns.com
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
MulticastDNS=yes
LLMNR=no
