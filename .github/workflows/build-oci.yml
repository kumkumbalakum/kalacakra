name: Build and Sign Kalacakra OS OCI Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE_NAME: ${{ github.repository_owner }}/kalacakra-os
  IMAGE_NVIDIA_NAME: ${{ github.repository_owner }}/kalacakra-nvidia

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Install lint tools
        run: pip install pyflakes

      - name: Syntax-check Python CLI Scripts (all)
        run: |
          python - <<'EOF'
          import os, sys, py_compile, tempfile
          bin_dir = "rootfs/usr/bin"
          failures = []
          with tempfile.TemporaryDirectory() as tmp:
              for name in sorted(os.listdir(bin_dir)):
                  path = os.path.join(bin_dir, name)
                  if not os.path.isfile(path):
                      continue
                  with open(path, "rb") as fh:
                      if b"python" not in fh.readline():
                          continue  # bukan script Python (mis. bash)
                  try:
                      py_compile.compile(path, cfile=os.path.join(tmp, name + ".pyc"), doraise=True)
                  except py_compile.PyCompileError as e:
                      failures.append(str(e))
          if failures:
              print("Script gagal compile:\n" + "\n".join(failures))
              sys.exit(1)
          print("Semua script Python lolos py_compile")
          EOF

      - name: Pyflakes (undefined names)
        run: |
          set -e
          status=0
          for f in rootfs/usr/bin/*; do
            head -1 "$f" | grep -q python || continue
            out=$(pyflakes "$f" 2>&1 | grep "undefined name" || true)
            if [ -n "$out" ]; then
              echo "$out"
              status=1
            fi
          done
          exit $status

      - name: Syntax-check Bash Scripts
        run: |
          bash -n rootfs/usr/bin/k-aur
          bash -n rootfs/usr/share/kalacakra/scripts/battery-cap.sh
          bash -n rootfs/etc/profile.d/kalacakra-env.sh

      - name: Validate Locale JSON (EN/ID sync)
        run: |
          python - <<'EOF'
          import json, sys
          id_keys = set(json.load(open("rootfs/usr/share/kalacakra/locales/id.json")))
          en_keys = set(json.load(open("rootfs/usr/share/kalacakra/locales/en.json")))
          if id_keys != en_keys:
              print(f"Locale tidak sinkron! Selisih: {id_keys ^ en_keys}")
              sys.exit(1)
          print(f"Locale sinkron: {len(id_keys)} key per bahasa")
          EOF

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - file: Containerfile
            tag: latest
            image_name: kalacakra-os
          - file: Containerfile.nvidia
            tag: latest
            image_name: kalacakra-nvidia

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install Cosign for Image Signing
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry (podman)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Log in to GitHub Container Registry (docker, for cosign)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Extract Docker metadata
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          OWNER="${{ github.repository_owner }}"
          NAME="${{ matrix.image_name }}"
          REG="${{ env.REGISTRY }}"
          TAGS="${REG}/${OWNER}/${NAME}:latest ${REG}/${OWNER}/${NAME}:sha-${SHA_SHORT}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build Container Image (podman)
        run: |
          sudo podman build -f "${{ matrix.file }}" -t "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}:latest" .

      - name: Tag and Push Container Image
        if: github.event_name != 'pull_request'
        run: |
          OWNER="${{ github.repository_owner }}"
          NAME="${{ matrix.image_name }}"
          REG="${{ env.REGISTRY }}"
          SHA_SHORT="${GITHUB_SHA::7}"
          IMAGE="${REG}/${OWNER}/${NAME}"
          sudo podman tag "${IMAGE}:latest" "${IMAGE}:sha-${SHA_SHORT}"
          sudo podman push "${IMAGE}:latest"
          sudo podman push "${IMAGE}:sha-${SHA_SHORT}"

      - name: Sign Container Image with Cosign (Keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          DIGEST=$(sudo podman inspect --format '{{.Digest}}' "${IMAGE}:latest")
          cosign sign --yes "${IMAGE}@${DIGEST}"
