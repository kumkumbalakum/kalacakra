name: Build and Sign Kalacakra OS OCI Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE_NAME: ${{ github.repository_owner }}/kalacakra-os
  IMAGE_NVIDIA_NAME: ${{ github.repository_owner }}/kalacakra-nvidia

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Syntax-check Python CLI Scripts
        run: |
          python -m py_compile \
            rootfs/usr/bin/kalacakra \
            rootfs/usr/bin/k-ai \
            rootfs/usr/bin/k-doctor \
            rootfs/usr/bin/k-interceptor \
            rootfs/usr/share/kalacakra/lib/kalacakra_common.py

      - name: Syntax-check Bash Scripts
        run: |
          bash -n rootfs/usr/bin/k-aur
          bash -n rootfs/usr/share/kalacakra/scripts/battery-cap.sh
          bash -n rootfs/etc/profile.d/kalacakra-env.sh

      - name: Validate Locale JSON (EN/ID sync)
        run: |
          python - <<'EOF'
          import json, sys
          id_keys = set(json.load(open("rootfs/usr/share/kalacakra/locales/id.json")))
          en_keys = set(json.load(open("rootfs/usr/share/kalacakra/locales/en.json")))
          if id_keys != en_keys:
              print(f"Locale tidak sinkron! Selisih: {id_keys ^ en_keys}")
              sys.exit(1)
          print(f"Locale sinkron: {len(id_keys)} key per bahasa")
          EOF

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - file: Containerfile
            tag: latest
            image_name: kalacakra-os
          - file: Containerfile.nvidia
            tag: latest
            image_name: kalacakra-nvidia

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign for Image Signing
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=sha,format=short

      - name: Build and Push Container Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign Container Image with Cosign (Keyless)
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
